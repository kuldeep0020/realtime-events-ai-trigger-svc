apiVersion: v1
kind: Service
metadata:
  name: {{ include "realtime-ai-trigger-svc.fullname" . }}
  labels:
    {{- include "realtime-ai-trigger-svc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "realtime-ai-trigger-svc.selectorLabels" . | nindent 4 }}
