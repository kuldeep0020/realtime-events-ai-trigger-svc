apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "realtime-ai-trigger-svc.fullname" . }}
  labels:
    {{- include "realtime-ai-trigger-svc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "realtime-ai-trigger-svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "realtime-ai-trigger-svc.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Plain (non-secret) env vars from values.env
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            # Secret env vars — supplied via --set secretEnv.<KEY>=<value> at install time
            {{- range $key, $val := .Values.secretEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            - name: seed-files
              mountPath: /etc/seed
              readOnly: true
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
      volumes:
        - name: seed-files
          configMap:
            name: {{ include "realtime-ai-trigger-svc.fullname" . }}-seed
