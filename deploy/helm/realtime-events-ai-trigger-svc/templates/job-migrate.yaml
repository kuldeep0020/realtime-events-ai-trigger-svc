{{- if .Values.jobMigrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "realtime-events-ai-trigger-svc.fullname" . }}-migrate
  labels:
    {{- include "realtime-events-ai-trigger-svc.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "realtime-events-ai-trigger-svc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/realtime-trigger", "migrate"]
          env:
            - name: POSTGRES_DSN
              value: {{ .Values.env.POSTGRES_DSN | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
{{- end }}
