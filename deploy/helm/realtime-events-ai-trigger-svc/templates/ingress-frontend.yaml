{{- if and .Values.frontend.enabled .Values.frontend.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "realtime-events-ai-trigger-svc.frontendFullname" . }}
  labels:
    {{- include "realtime-events-ai-trigger-svc.frontendLabels" . | nindent 4 }}
  {{- with .Values.frontend.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.frontend.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.frontend.ingress.host | quote }}
      secretName: {{ include "realtime-events-ai-trigger-svc.frontendFullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.frontend.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "realtime-events-ai-trigger-svc.frontendFullname" . }}
                port:
                  number: 3001
{{- end }}
