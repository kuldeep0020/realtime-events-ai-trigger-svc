{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "realtime-events-ai-trigger-svc.fullname" . }}
  labels:
    {{- include "realtime-events-ai-trigger-svc.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "realtime-events-ai-trigger-svc.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "realtime-events-ai-trigger-svc.fullname" . }}
                port:
                  number: 8080
{{- end }}
